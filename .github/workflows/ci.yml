name: Run tests
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: {}
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Git checkout
        uses: actions/checkout@v4
      - name: NPM ci, build, & test
        run: |
          npm ci
          npm run build --if-present
          npm test
          npm run examples
        env:
          CI: true
